<!doctype html><meta charset="utf-8"><title>Lineup</title>
<style>html,body{margin:0;background:#15130f}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildCar, preloadWarhorse } from '../src/cars3d.js';
const ids = ['rustbucket','stinger','bulldog','hellfire','maiden','viper','juggernaut','warhorse'];
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(1600, 800); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x2a2620);
s.add(new THREE.HemisphereLight(0xfff0dd, 0x5a4a38, 2.2));
const d = new THREE.DirectionalLight(0xffdcb0, 2.6); d.position.set(8, 14, 10); d.castShadow = true;
d.shadow.camera.left = -30; d.shadow.camera.right = 30; d.shadow.camera.top = 20; d.shadow.camera.bottom = -20; d.shadow.mapSize.set(2048, 2048); s.add(d);
const gr = new THREE.Mesh(new THREE.PlaneGeometry(100, 60), new THREE.MeshStandardMaterial({ color: 0x6a6052, roughness: 1 })); gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true; s.add(gr);
await preloadWarhorse();
r.setScissorTest(true);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 200); cam.position.set(7, 4.2, 8); cam.lookAt(0, 0.9, 0);
let prev = null;
ids.forEach((id, i) => {
  if (prev) s.remove(prev);
  const c = buildCar(id); c.rotation.y = 0.2; s.add(c); prev = c;
  const x = (i % 4) * 400, y = (1 - Math.floor(i / 4)) * 400;
  r.setViewport(x, y, 400, 400); r.setScissor(x, y, 400, 400); r.render(s, cam);
});
window.DONE = true;
</script>
