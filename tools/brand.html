<!doctype html>
<meta charset="utf-8">
<title>IronMetal brand render</title>
<!-- Renders the app icon (?mode=icon) or splash screen (?mode=splash) for the Android build. Screenshot it with tools/brand.mjs. -->
<style>
@font-face{font-family:"Saira Stencil One";src:url("../assets/fonts/SairaStencilOne-Regular.ttf")}
@font-face{font-family:"Saira Condensed";font-weight:800;src:url("../assets/fonts/SairaCondensed-ExtraBold.ttf")}
html,body{margin:0;background:#070605;overflow:hidden}
#stage{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 42%,#2a231c 0%,#120f0c 55%,#060504 100%)}
canvas{position:absolute;display:block}
.word{position:absolute;left:0;right:0;text-align:center;line-height:.86;font-family:"Saira Stencil One"}
.steel{background:linear-gradient(180deg,#f7f4ee 0%,#c3c0b8 36%,#5d5b56 52%,#e1ddd4 68%,#8a8780 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.flame{background:linear-gradient(180deg,#fff6cf 0%,#ffc23f 26%,#ff6a1a 56%,#b81f0b 84%,#5a0c04 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:0;right:0;text-align:center;font:800 1px "Saira Condensed";color:#f0b429;text-shadow:0 0 .4em rgba(255,140,30,.6)}
</style>
<div id="stage"><canvas id="fire"></canvas><canvas id="plate"></canvas><div id="logo"></div></div>
<script>
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'icon', S = +(q.get('size') || (mode === 'icon' ? 1024 : 2732));
const stage = document.getElementById('stage'); stage.style.width = stage.style.height = S + 'px';

// metal plate texture: scratches, rivets, rust blooms, a bevel frame (icon only)
const plate = document.getElementById('plate'); plate.width = plate.height = S; plate.style.inset = 0;
const g = plate.getContext('2d');
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < S * 1.4; i++) { g.strokeStyle = `rgba(255,240,220,${rnd() * 0.035})`; g.lineWidth = 1; const x = rnd() * S, y = rnd() * S, l = rnd() * S * 0.12; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + l * (rnd() - 0.5) * 0.2); g.stroke(); }
for (let i = 0; i < 22; i++) { const x = rnd() * S, y = rnd() * S, r = S * (0.02 + rnd() * 0.07); const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(120,52,18,.32)'); gr.addColorStop(1, 'rgba(120,52,18,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
if (mode === 'icon') {
  const b = S * 0.035; g.lineWidth = b; g.strokeStyle = '#2b2620'; g.strokeRect(b / 2, b / 2, S - b, S - b);
  g.lineWidth = S * 0.006; g.strokeStyle = 'rgba(255,200,140,.18)'; g.strokeRect(b, b, S - b * 2, S - b * 2);
  for (const [x, y] of [[0.09, 0.09], [0.91, 0.09], [0.09, 0.91], [0.91, 0.91]]) {
    const gr = g.createRadialGradient(x * S - S * 0.006, y * S - S * 0.006, 0, x * S, y * S, S * 0.024);
    gr.addColorStop(0, '#d9d4cb'); gr.addColorStop(0.5, '#6d6860'); gr.addColorStop(1, '#1d1a16');
    g.fillStyle = gr; g.beginPath(); g.arc(x * S, y * S, S * 0.022, 0, 7); g.fill();
  }
  // hazard band
  const hy = S * 0.84, hh = S * 0.07; g.save(); g.beginPath(); g.rect(S * 0.06, hy, S * 0.88, hh); g.clip();
  g.fillStyle = '#e9ad25'; g.fillRect(0, hy, S, hh); g.fillStyle = '#16120c';
  for (let x = -S; x < S * 2; x += hh * 1.6) { g.beginPath(); g.moveTo(x, hy + hh); g.lineTo(x + hh * 0.8, hy + hh); g.lineTo(x + hh * 1.8, hy); g.lineTo(x + hh, hy); g.fill(); }
  g.restore();
}

// cellular fire
const W = 110, H = 64, fire = document.getElementById('fire');
fire.width = W; fire.height = H;
const fw = mode === 'icon' ? S * 1.0 : S * 0.78, fh = mode === 'icon' ? S * 0.66 : S * 0.3;
const fade = mode === 'icon' ? 'linear-gradient(to top, transparent 0%, #000 22%, #000 62%, transparent 100%)' : 'radial-gradient(ellipse 50% 50% at 50% 62%, #000 45%, transparent 100%)';
Object.assign(fire.style, { width: fw + 'px', height: fh + 'px', left: (S - fw) / 2 + 'px', top: (mode === 'icon' ? S * 0.84 - fh : S * 0.505 - fh) + 'px', filter: `blur(${S * (mode === 'icon' ? 0.011 : 0.006)}px) saturate(1.15)`, imageRendering: 'auto', maskImage: fade, webkitMaskImage: fade });
const fx = fire.getContext('2d'), px = new Uint8Array(W * H), img = fx.createImageData(W, H), pal = [];
for (let i = 0; i < 37; i++) { const t = i / 36; pal.push([Math.min(255, t * 3 * 255), Math.min(255, Math.max(0, (t * 3 - 1) * 255)) * 0.85, Math.min(255, Math.max(0, (t * 3 - 2) * 255)) * 0.55, i ? Math.min(255, 50 + t * 320) : 0]); }
const mask = (x) => { const c = x / W - 0.5; return Math.max(0, 1 - Math.pow(Math.abs(c) * 2.1, 3)); };
for (let step = 0; step < 220; step++) {
  for (let x = 0; x < W; x++) px[(H - 1) * W + x] = rnd() < mask(x) * 0.95 ? 36 : Math.floor(mask(x) * 30);
  for (let y = 1; y < H; y++) for (let x = 0; x < W; x++) { const src = y * W + x, r = (rnd() * 3) | 0, dst = src - W - r + 1; if (dst >= 0) px[dst] = Math.max(0, px[src] - (r & 1) - (rnd() < 0.28 ? 1 : 0)); }
}
for (let i = 0; i < px.length; i++) { const c = pal[px[i]]; img.data.set([c[0], c[1], c[2], c[3]], i * 4); }
fx.putImageData(img, 0, 0);

// logo text
const logo = document.getElementById('logo');
if (mode === 'icon') {
  logo.innerHTML = `<div class="word" style="top:${S * 0.2}px;font-size:${S * 0.52}px;letter-spacing:-${S * 0.01}px;filter:drop-shadow(0 ${S * 0.008}px 0 #000) drop-shadow(0 0 ${S * 0.04}px rgba(255,90,20,.75))"><span class="steel">I</span><span class="flame">M</span></div>`;
} else {
  logo.innerHTML = `<div class="word" style="top:${S * 0.39}px;font-size:${S * 0.12}px;filter:drop-shadow(0 ${S * 0.004}px 0 #000) drop-shadow(0 0 ${S * 0.02}px rgba(255,90,20,.7))"><span class="steel">IRON</span><span class="flame">METAL</span></div>
  <div class="sub" style="top:${S * 0.515}px;font-size:${S * 0.026}px;letter-spacing:.42em">WASTELAND WARS</div>`;
}
document.fonts.ready.then(() => { window.READY = true; });
</script>
